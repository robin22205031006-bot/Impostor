name: Build Android APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build Web and Capacitor APK
        run: |
          npm install
          npm run build --if-present
          npx @capacitor/cli create-project
          # Fallback directory setup if dist doesn't exist
          if [ ! -d "dist" ]; then mkdir dist && cp index.html dist/ 2>/dev/null || true; fi
          npm install @capacitor/core @capacitor/android
          npx cap init "Impostor" "com.zanan.impostor" --web-dir dist --yes
          npx cap add android
          cd android && ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
